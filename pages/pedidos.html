<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos | Sensaciones</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="site">
    <header class="site-header">
      <a class="brand" href="../index.html"><span class="brand-name">☕ SENSACIONES</span><span class="brand-subtitle">CAFETERÍA &amp; BOLLERÍA</span></a>
      <nav class="main-nav">
        <a href="../index.html">Inicio</a>
        <a href="menu.html">Menú</a>
        <a class="active" href="pedidos.html">Pedidos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contactos</a>
      </nav>
    </header>
    <section class="favorites">
      <h2>Realizar pedido</h2>
      <form id="pedidoForm" style="max-width:480px;margin:0 auto;text-align:left;">
        <label>Nombre<br><input type="text" name="nombre" required style="width:100%;padding:8px;margin:6px 0 12px;"></label>
        <label>Producto<br><select name="producto" style="width:100%;padding:8px;margin:6px 0 12px;"><option>Café Latte</option><option>Croissant</option><option>Jugo de naranja</option><option>Sándwich de pavita</option></select></label>
        <label>Cantidad<br><input type="number" name="cantidad" min="1" value="1" required style="width:100%;padding:8px;margin:6px 0 12px;"></label>
        <button class="button" type="submit">Enviar pedido</button>
      </form>
      <p id="msg" class="tagline"></p>
    </section>
  </main>
  <script>
    document.getElementById('pedidoForm').addEventListener('submit', function(e){
      e.preventDefault();
      document.getElementById('msg').textContent = 'Pedido enviado. ¡Gracias!';
    });
  </script>
</body>
</html>
